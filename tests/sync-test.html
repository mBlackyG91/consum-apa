<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Test sincronizare (Drive simulat)</title>
<style>body{font:14px/1.4 monospace;padding:16px}.ok{color:green}.fail{color:#b00;font-weight:bold}</style>
</head>
<body>
<h1>Test sincronizare cu Drive simulat</h1>
<p>Deschide pagina prin serverul local (http://localhost:...). Nu folosește Google real.</p>
<pre id="out"></pre>
<script>
// ---------- mediu simulat ----------
localStorage.removeItem('evidenta-apa:sync'); localStorage.removeItem('evidenta-apa:token'); localStorage.removeItem('evidenta-apa:base');
window.APP_CONFIG = { GOOGLE_CLIENT_ID: 'test-client.apps.googleusercontent.com', DRIVE_FILE_NAME: 'evidenta-apa.json', SAVE_DEBOUNCE_MS: 400 };
let tokN = 0; const validTokens = new Set();
window.google = { accounts: { oauth2: {
  initTokenClient(cfg) { return { requestAccessToken() { setTimeout(() => { const t = 'tok' + (++tokN); validTokens.add(t); cfg.callback({ access_token: t, expires_in: 3600 }); }, 5); } }; },
  hasGrantedAllScopes: () => true, revoke() {},
} } };
let online = true;
Object.defineProperty(navigator, 'onLine', { get: () => online, configurable: true });
const server = { files: {}, n: 0, calls: [] };
function remoteWrite(id, content) { const f = server.files[id]; f.content = content; f.version++; f.modifiedTime = new Date().toISOString(); }
const realFetch = window.fetch.bind(window);
window.fetch = async (url, opt = {}) => {
  url = String(url);
  if (!url.includes('googleapis.com')) return realFetch(url, opt);
  if (!online) throw new TypeError('Failed to fetch');
  const method = opt.method || 'GET';
  server.calls.push(method + ' ' + url.replace(/\?.*/, ''));
  const tok = ((opt.headers || {}).Authorization || '').replace('Bearer ', '');
  const J = (o, s = 200) => new Response(JSON.stringify(o), { status: s, headers: { 'Content-Type': 'application/json' } });
  if (!validTokens.has(tok)) return J({ error: { message: 'Invalid Credentials' } }, 401);
  const meta = (f) => ({ id: f.id, name: f.name, version: String(f.version), modifiedTime: f.modifiedTime, trashed: !!f.trashed });
  const m = url.match(/\/files\/([^?/]+)/);
  if (method === 'GET' && !m) return J({ files: Object.values(server.files).filter((f) => !f.trashed).map(meta) });
  if (method === 'GET' && m) {
    const f = server.files[m[1]]; if (!f) return J({ error: { message: 'nf' } }, 404);
    if (url.includes('alt=media')) return new Response(f.content, { status: 200 });
    return J(meta(f));
  }
  if (method === 'POST' && m && /\/copy/.test(url)) {
    const src = server.files[m[1]]; if (!src) return J({ error: { message: 'nf' } }, 404);
    const id = 'file' + (++server.n);
    server.files[id] = { id, name: JSON.parse(opt.body).name, content: src.content, version: 1, modifiedTime: new Date().toISOString() };
    return J(meta(server.files[id]));
  }
  if (method === 'POST') {
    const b = opt.body; const parts = b.split(/--apa\w+/);
    const content = parts[2].split('\r\n\r\n').slice(1).join('\r\n\r\n').replace(/\r\n$/, '');
    const id = 'file' + (++server.n);
    server.files[id] = { id, name: JSON.parse(parts[1].split('\r\n\r\n')[1]).name, content, version: 1, modifiedTime: new Date().toISOString() };
    return J(meta(server.files[id]));
  }
  if (method === 'PATCH' && m && !url.includes('uploadType=media')) { Object.assign(server.files[m[1]], JSON.parse(opt.body)); return J(meta(server.files[m[1]])); }
  if (method === 'PATCH' && m) { remoteWrite(m[1], opt.body); return J(meta(server.files[m[1]])); }
  return J({}, 400);
};

// ---------- „aplicația” minimă ----------
let data = { schema: 1, apartments: [{ id: 'a', number: '1' }], months: {} };
let setDataCalls = 0, merges = [], statuses = [];
const hooks = {
  getData: () => data,
  setData: (d) => { data = d; setDataCalls++; },
  isPristine: (d) => !d.apartments.some((a) => a.number),
  onStatus: (s) => statuses.push(s.text),
  merge: (b, l, r) => Merge.merge(b, l, r),
  onMerge: (notes) => merges.push(notes),
};
const out = document.getElementById('out');
let failed = 0;
function check(name, cond, extra) { out.innerHTML += '<span class="' + (cond ? 'ok' : 'fail') + '">' + (cond ? '✔ ' : '✘ ') + name + (extra ? ' — ' + extra : '') + '</span>\n'; if (!cond) failed++; }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const file = () => Object.values(server.files)[0];
const backups = () => Object.values(server.files).filter((f) => /^evidenta-apa-backup-/.test(f.name) && !f.trashed);
const mainFiles = () => Object.values(server.files).filter((f) => !/^evidenta-apa-backup-/.test(f.name));
const pad = (n) => String(n).padStart(2, '0');
const todayStr = (() => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); })();
const status = () => Sync.status().text;
function change(fn) { fn(); data.updatedAt = new Date().toISOString(); Sync.markDirty(); }
const PEND = 'Salvat aici · se trimite după ce termini';
</script>
<script src="../merge.js"></script>
<script src="../backup.js"></script>
<script src="../drive.js"></script>
<script>
(async () => {
  Sync.init(hooks);
  check('Neconectat: stare „Doar pe acest dispozitiv”', status() === 'Doar pe acest dispozitiv', status());

  // 1. conectare, fișierul nu există → se creează
  await sleep(50);
  await Sync.connect();
  check('1. Fișier creat în Drive la prima conectare', !!file() && JSON.parse(file().content).apartments[0].number === '1');
  check('1. Stare „Sincronizat”', status() === 'Sincronizat', status());

  // 2. modificare → debounce → PATCH
  const callsBefore = server.calls.length;
  change(() => { data.apartments[0].number = '2'; });
  check('2. Imediat după modificare: „se trimite după ce termini”', status() === PEND, status());
  await sleep(200);
  check('2. Nimic trimis înainte de expirarea debounce', server.calls.length === callsBefore);
  change(() => { data.apartments[0].owner = 'X'; });
  await sleep(700);
  const patches = server.calls.slice(callsBefore).filter((c) => c.startsWith('PATCH')).length;
  check('2. După debounce: o singură scriere pentru 2 modificări rapide', patches === 1, patches + ' PATCH');
  check('2. Conținut în Drive actualizat', JSON.parse(file().content).apartments[0].owner === 'X');
  check('2. Stare „Sincronizat”', status() === 'Sincronizat', status());
  check('2. La prima salvare a zilei s-a făcut o copie de siguranță', backups().length === 1 && backups()[0].name === 'evidenta-apa-backup-' + todayStr + '.json', backups().map((b) => b.name).join());
  check('2. Copia conține starea DINAINTE de suprascriere', JSON.parse(backups()[0].content).apartments[0].number === '1');

  // 3. modificare de pe alt dispozitiv, local curat → preluare automată
  remoteWrite(file().id, JSON.stringify({ schema: 1, apartments: [{ id: 'a', number: '3' }], months: {} }));
  await Sync.syncNow();
  check('3. Versiunea din Drive preluată automat (fără modificări locale)', data.apartments[0].number === '3' && setDataCalls === 1);

  // 4. ambele părți modificate, câmpuri DIFERITE → îmbinare automată, fără dialog și fără notă
  const dr = () => JSON.parse(file().content);
  remoteWrite(file().id, JSON.stringify({ schema: 1, updatedAt: '2030-01-01T00:00:00Z', apartments: [{ id: 'a', number: '3', owner: 'DIN-DRIVE' }], months: {} }));
  change(() => { data.apartments[0].defaultPersons = 4; });
  await sleep(900);
  check('4. Fără dialog: nicio notă de conflict', merges.length === 0);
  check('4. Ambele modificări sunt în Drive', dr().apartments[0].owner === 'DIN-DRIVE' && dr().apartments[0].defaultPersons === 4, JSON.stringify(dr().apartments[0]));
  check('4. Ambele modificări sunt și local', data.apartments[0].owner === 'DIN-DRIVE' && data.apartments[0].defaultPersons === 4);
  check('4. Stare „Sincronizat”', status() === 'Sincronizat', status());

  // 5. ACEEAȘI valoare schimbată pe ambele → câștigă cea mai recentă + notă
  remoteWrite(file().id, JSON.stringify({ schema: 1, updatedAt: '2000-01-01T00:00:00Z', apartments: [{ id: 'a', number: 'REMOTE2', owner: 'DIN-DRIVE', defaultPersons: 4 }], months: {} }));
  change(() => { data.apartments[0].number = 'LOCAL2'; });
  await sleep(900);
  check('5. Valoare schimbată pe ambele: câștigă cea mai recentă (local)', dr().apartments[0].number === 'LOCAL2' && data.apartments[0].number === 'LOCAL2');
  check('5. Utilizatorul primește o notă cu valoarea înlocuită', merges.length === 1 && merges[0][0].remote === 'REMOTE2' && merges[0][0].kept === 'local');
  remoteWrite(file().id, JSON.stringify({ schema: 1, updatedAt: '2999-01-01T00:00:00Z', apartments: [{ id: 'a', number: 'REMOTE3', owner: 'DIN-DRIVE', defaultPersons: 4 }], months: {} }));
  change(() => { data.apartments[0].number = 'LOCAL3'; });
  await sleep(900);
  check('5. Când Drive e mai recent, câștigă Drive și apare nota', data.apartments[0].number === 'REMOTE3' && merges.length === 2 && merges[1][0].kept === 'remote');

  // 6. offline
  online = false; window.dispatchEvent(new Event('offline'));
  change(() => { data.apartments[0].number = 'OFFLINE'; });
  await sleep(700);
  check('6. Offline: stare „Offline, se va sincroniza”', status() === 'Offline, se va sincroniza', status());
  check('6. Offline: Drive neschimbat', JSON.parse(file().content).apartments[0].number === 'REMOTE3');
  online = true; window.dispatchEvent(new Event('online'));
  await sleep(150);
  check('6. La reconectare: modificarea ajunge în Drive', JSON.parse(file().content).apartments[0].number === 'OFFLINE' && status() === 'Sincronizat', status());

  // 7. token expirat / revocat pe server
  validTokens.clear();
  change(() => { data.apartments[0].number = 'DUPA-EXPIRARE'; });
  await sleep(700);
  check('7. Token expirat: stare „Reconectează Google Drive”', status() === 'Reconectează Google Drive', status());
  check('7. Datele locale păstrate', data.apartments[0].number === 'DUPA-EXPIRARE' && Sync.info().dirty);
  await Sync.connect();
  check('7. După reconectare: modificarea ajunge în Drive', JSON.parse(file().content).apartments[0].number === 'DUPA-EXPIRARE' && status() === 'Sincronizat', status());

  // 8. al doilea dispozitiv (cache gol) → preia din Drive
  localStorage.removeItem('evidenta-apa:sync'); localStorage.removeItem('evidenta-apa:base');
  data = { schema: 1, apartments: [{ id: 'z', number: '' }], months: {} }; setDataCalls = 0;
  const src = await (await fetch('../drive.js')).text();
  (0, eval)(src);
  Sync.init(hooks);
  await Sync.connect();
  check('8. Dispozitiv nou, fără date: preia automat din Drive', data.apartments[0].number === 'DUPA-EXPIRARE' && setDataCalls === 1);
  check('8. Nu s-a creat un al doilea fișier', mainFiles().length === 1);

  // 9. dispozitiv nou CU date locale diferite → îmbinare (uniune), fără dialog
  localStorage.removeItem('evidenta-apa:sync'); localStorage.removeItem('evidenta-apa:base');
  data = { schema: 1, updatedAt: new Date().toISOString(), apartments: [{ id: 'q', number: '99' }], months: {} };
  const mBefore = merges.length;
  (0, eval)(src);
  Sync.init(hooks);
  await Sync.connect();
  await sleep(100);
  const nums9 = data.apartments.map((a) => a.number).sort().join();
  check('9. Dispozitiv nou cu date proprii: ambele seturi de apartamente păstrate', nums9 === '99,DUPA-EXPIRARE', nums9);
  check('9. Fără conflict și fără notă', merges.length === mBefore);
  check('9. Rezultatul îmbinat este și în Drive', JSON.parse(file().content).apartments.length === 2);

  // 10. plecarea din pagină trimite imediat, fără să aștepte pauza
  const callsB = server.calls.length;
  data.apartments[0].owner = 'LA-PLECARE'; Sync.markDirty();
  Object.defineProperty(document, 'visibilityState', { get: () => 'hidden', configurable: true });
  document.dispatchEvent(new Event('visibilitychange'));
  await sleep(150);
  check('10. La ascunderea paginii datele pleacă imediat', server.calls.slice(callsB).some((c) => c.startsWith('PATCH')) && JSON.parse(file().content).apartments[0].owner === 'LA-PLECARE');

  // 11. a doua salvare în aceeași zi nu mai face copie; ziua nouă face și curăță copiile vechi
  check('11. O singură copie pe zi (după mai multe salvări)', backups().length === 1, String(backups().length));
  const addFile = (name) => { const id = 'file' + (++server.n); server.files[id] = { id, name, content: file().content, version: 1, modifiedTime: new Date().toISOString() }; return id; };
  const oldId = addFile('evidenta-apa-backup-2020-01-01.json');
  const recent = new Date(Date.now() - 3 * 86400000); const recentName = 'evidenta-apa-backup-' + recent.getFullYear() + '-' + pad(recent.getMonth() + 1) + '-' + pad(recent.getDate()) + '.json';
  const recentId = addFile(recentName);
  const lsm = JSON.parse(localStorage.getItem('evidenta-apa:sync')); lsm.lastBackupDay = '2000-01-01'; localStorage.setItem('evidenta-apa:sync', JSON.stringify(lsm));
  (0, eval)(src); Sync.init(hooks);
  Object.defineProperty(document, 'visibilityState', { get: () => 'visible', configurable: true });
  data.apartments[0].owner = 'ZI-NOUA'; Sync.markDirty(); await sleep(900);
  check('11. Ziua nouă: copiile mai vechi de un an sunt puse la gunoi', server.files[oldId].trashed === true);
  check('11. Copia recentă (3 zile) se păstrează', !server.files[recentId].trashed);
  check('11. Fișierul principal nu e atins', !file().trashed && JSON.parse(file().content).apartments[0].owner === 'ZI-NOUA');
  const listed = await Sync.listBackups();
  check('11. Lista copiilor pentru restaurare e sortată, cele noi primele', listed.length === 2 && listed[0].day >= listed[1].day, JSON.stringify(listed.map((l) => l.day)));
  const restored = await Sync.fetchBackup(listed[0].id);
  check('11. O copie poate fi descărcată pentru restaurare', Array.isArray(restored.apartments));

  out.innerHTML += '\n' + (failed ? '<span class="fail">' + failed + ' TESTE EȘUATE</span>' : '<span class="ok">TOATE TESTELE AU TRECUT</span>');
  document.title = failed ? 'FAIL ' + failed : 'PASS';
})().catch((e) => { out.innerHTML += '<span class="fail">EXCEPȚIE: ' + e.stack + '</span>'; document.title = 'FAIL exc'; });
</script>
</body>
</html>
